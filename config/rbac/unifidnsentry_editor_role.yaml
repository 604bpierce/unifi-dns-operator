# This rule is not used by the project unifi-dns-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dns.bx.network.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: unifi-dns-operator
    app.kubernetes.io/managed-by: kustomize
  name: unifidnsentry-editor-role
rules:
- apiGroups:
  - dns.bx.network
  resources:
  - unifidnsentries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dns.bx.network
  resources:
  - unifidnsentries/status
  verbs:
  - get
